[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bimanual-redundancy-work"
version = "0.1.0"
description = "MuJoCo experiments for task-specific redundancy optimization in cooperative dual-arm manipulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "daqp==0.8.7",
    "loop-rate-limiters==1.2.0",
    "matplotlib>=3.10",
    "mink==1.1.1",
    "mujoco==3.8.1",
    "numpy==2.4.6",
    "qpsolvers==4.12.0",
    "seaborn>=0.13",
    "scipy==1.17.1",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["MUJOCO*"]
